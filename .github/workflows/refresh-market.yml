name: Refresh market data

on:
  schedule:
    # 21:30 UTC on weekdays, about an hour after the US close (23:30 Stockholm)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      budget:
        description: "Alpha Vantage calls to spend (free tier allows 25 a day)"
        default: "24"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull quotes within the daily budget
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          AV_BUDGET: ${{ github.event.inputs.budget || '24' }}
        run: python scripts/refresh_market.py
      - name: Commit the snapshot
        run: |
          git config user.name "mantis-refresh"
          git config user.email "mantis-refresh@users.noreply.github.com"
          git add graph/data/market.json
          git diff --cached --quiet && echo "no change" || git commit -m "market: refresh $(date -u +%Y-%m-%d)"
          git push
